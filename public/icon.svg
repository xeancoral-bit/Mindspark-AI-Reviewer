<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>

    <!-- Brain Gradient -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0040c0;stop-opacity:1" />
    </linearGradient>

    <!-- Brain Fissures Mask -->
    <mask id="brainMask">
      <rect x="0" y="0" width="512" height="512" fill="white" />
      <!-- Fissures drawn in black to punch holes through the brain -->
      <path d="M 175,235 C 195,235 210,225 235,235" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
      <path d="M 195,145 C 195,170 180,190 200,205" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
      <path d="M 170,170 C 185,185 190,195 220,190" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
      <path d="M 140,200 C 160,205 175,215 175,230" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
      <path d="M 155,290 C 175,285 190,265 215,275" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
      <path d="M 190,320 C 205,315 210,295 230,305" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Central logo group, slightly scaled & translated to center it -->
  <g transform="translate(10, 10) scale(0.96)">
    <!-- Brain (Left Hemisphere) -->
    <path d="M 256,120
             C 230,120 215,130 210,145
             C 195,140 175,150 170,170
             C 155,165 140,180 135,200
             C 130,220 140,240 155,245
             C 145,255 140,275 150,295
             C 160,315 180,320 190,320
             C 185,330 195,345 215,350
             C 235,355 250,345 256,335
             Z" fill="url(#brainGrad)" mask="url(#brainMask)" />

    <!-- Lightbulb Outline (Right side) -->
    <path d="M 256,120 C 370,120 370,290 310,345 C 295,360 295,360 295,360" fill="none" stroke="#ffc800" stroke-width="20" stroke-linecap="round" />

    <!-- Rays -->
    <line x1="300" y1="180" x2="325" y2="140" stroke="#ffc800" stroke-width="12" stroke-linecap="round" />
    <line x1="320" y1="230" x2="355" y2="215" stroke="#ffc800" stroke-width="12" stroke-linecap="round" />
    <line x1="320" y1="285" x2="355" y2="300" stroke="#ffc800" stroke-width="12" stroke-linecap="round" />
    <line x1="300" y1="330" x2="325" y2="365" stroke="#ffc800" stroke-width="12" stroke-linecap="round" />

    <!-- Base Threads (Navy/Dark Blue) -->
    <path d="M 225,375 L 287,375" stroke="#1d2d50" stroke-width="16" stroke-linecap="round" />
    <path d="M 229,400 L 283,400" stroke="#1d2d50" stroke-width="16" stroke-linecap="round" />
    <path d="M 237,425 L 275,425" stroke="#1d2d50" stroke-width="16" stroke-linecap="round" />
    <!-- Base Bottom Tip -->
    <path d="M 245,443 C 245,443 245,458 256,458 C 267,458 267,443 267,443 Z" fill="#1d2d50" />

    <!-- Spark (Center 4-pointed Star) -->
    <path d="M 256,160 Q 256,238 210,238 Q 256,238 256,316 Q 256,238 302,238 Q 256,238 256,160 Z" fill="#ffc800" />
  </g>
</svg>
